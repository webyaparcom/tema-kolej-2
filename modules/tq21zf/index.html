<script>
  (() => {
    const P = "modulex-referans-vitrin-secim";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const secim = (s, P) => {
        const c = [...s.querySelectorAll("[data-sec]")];
        const p = [...s.querySelectorAll("[data-secim]")];
        if (!c.length) return;
        s.classList.add(P + "--js");
        const sec = (n) => {
          c.forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.sec === n)));
          p.forEach((x) => { x.hidden = x.dataset.secim !== n; });
        };
        sec(c[0].dataset.sec);
        c.forEach((x) => x.addEventListener("click", () => sec(x.dataset.sec)));
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      secim(s, P, az);
    });
  })();
</script>
